<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بتاز | بازی ماشینی</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#0b0d12"></head>
<body>
<div class="hud"><div><b>🏁 بتاز | رالی</b><span id="score">امتیاز: ۰</span></div><div><span id="speed">سرعت: ۰</span><span id="best">رکورد: ۰</span><span id="level">مرحله: ۱</span><span id="gear">دنده: N</span></div></div>
<div id="terrainMenu" class="terrain-menu"><h2>انتخاب مسیر</h2><button data-terrain="desert">🏜️ صحرا</button><button data-terrain="forest">🌲 جنگل</button><button data-terrain="city">🏙️ شهر</button><button data-terrain="highway">🛣️ جاده</button></div><main><canvas id="game" width="900" height="600"></canvas><section class="controls"><button id="start">شروع بازی</button><button id="pause">توقف</button><div class="car-controls"><button id="brake">🛑 ترمز</button><button id="gas">⛽ گاز</button><button id="horn">📯 بوق</button><button id="lights">💡 چراغ</button><button id="stance">🚗 حالت: عادی</button></div><div class="steering"><span>فرمون دستی</span><button data-key="ArrowRight">◀</button><div class="wheel">◉</div><button data-key="ArrowLeft">▶</button></div><p>فرمون: ← → یا دکمه‌های دستی | گاز و ترمز را نگه دار</p></section></main><div id="levelToast" class="level-toast"></div>
<div class="touch"><button data-key="ArrowRight">◀</button><button data-key="ArrowLeft">▶</button></div>
<div class="mini-map"><b>🗺️ نقشه</b><canvas id="map" width="120" height="160"></canvas></div><div class="dash"><span id="lightsState">💡 خاموش</span><span id="hornState"></span></div><div id="message" class="message"><h1>بتاز</h1><p>از ماشین‌ها جاخالی بده و رکورد بزن!</p><button id="start2">شروع</button></div>
<script src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script></body></html>
