<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راننده خیابان | بازی ماشینی</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="hud"><div><b>🏁 راننده خیابان</b><span id="score">امتیاز: ۰</span></div><div><span id="speed">سرعت: ۰</span><span id="best">رکورد: ۰</span></div></div>
<main><canvas id="game" width="900" height="600"></canvas><section class="controls"><button id="start">شروع بازی</button><button id="pause">توقف</button><p>حرکت: ← → یا A/D &nbsp; | &nbsp; موبایل: دکمه‌های پایین</p></section></main>
<div class="touch"><button data-key="ArrowRight">◀</button><button data-key="ArrowLeft">▶</button></div>
<div id="message" class="message"><h1>🏎️ راننده خیابان</h1><p>از ماشین‌ها جاخالی بده و رکورد بزن!</p><button id="start2">شروع</button></div>
<script src="app.js"></script></body></html>
